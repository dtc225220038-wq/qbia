{% extends 'base.html' %}
{% block title %}Thanh toán{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-cash-coin"></i> Thanh toán đơn hàng</h3>

<div class="card p-4" style="max-width: 600px;">
    <ul class="list-group list-group-flush mb-3">
        {% for line in order['items'] %}
        <li class="list-group-item d-flex justify-content-between">
            <span>{{ line.name }} x{{ line.qty }}</span>
            <span>{{ (line.price * line.qty) | currency }}</span>
        </li>
        {% endfor %}
    </ul>
    <div class="d-flex justify-content-between fs-5 mb-3">
        <span>Tạm tính</span>
        <span>{{ subtotal | currency }}</span>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Giảm giá (%)</label>
            <input type="number" name="discount_percent" class="form-control" value="0" min="0" max="100">
        </div>
        <div class="mb-3">
            <label class="form-label">Hình thức thanh toán</label>
            <select name="payment_method" class="form-select">
                {% for key, label in payment_labels.items() %}
                <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success fw-bold w-100">Xác nhận thanh toán</button>
    </form>
</div>
{% endblock %}
